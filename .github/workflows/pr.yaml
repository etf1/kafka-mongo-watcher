name: Push (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go_version: [ '1.27' ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go_version }}

      - name: Run tests
        shell: script -q -e -c "bash {0}"
        run: go test -count=1 -v -cover ./...
